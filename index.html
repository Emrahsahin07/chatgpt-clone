<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT Clone</title>
  <style>
    :root {
      --bg-color: #343541;
      --sidebar-bg: #202123;
      --message-bg: #444654;
      --user-message-bg: #343541;
      --text-color: #ECECF1;
      --border-color: #565869;
      --input-bg: #40414F;
      --button-bg: #19C37D;
      --button-hover: #1A7F64;
      --hover-bg: #2A2B32;
      --sidebar-width: 260px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-toggle {
      display: none;
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1001;
      background: var(--hover-bg);
      border: none;
      color: var(--text-color);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .settings-button {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: var(--hover-bg);
      color: var(--text-color);
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1000;
    }

    .settings-button:hover {
      background: var(--border-color);
    }

    .settings-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .settings-modal.active {
      display: flex;
    }

    .settings-content {
      background: var(--sidebar-bg);
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .settings-title {
      font-size: 20px;
      font-weight: bold;
    }

    .close-button {
      background: none;
      border: none;
      color: var(--text-color);
      cursor: pointer;
      font-size: 24px;
    }

    .settings-section {
      margin-bottom: 20px;
    }

    .settings-section h3 {
      margin-bottom: 10px;
    }

    .settings-section p {
      color: #888;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .save-button {
      width: 100%;
      background: var(--button-bg);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
    }

    .save-button:hover {
      background: var(--button-hover);
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: transform 0.3s ease;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar.collapsed {
      transform: translateX(-100%);
    }

    .new-chat-btn {
      background: var(--button-bg);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .new-chat-btn:hover {
      background: var(--button-hover);
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-item:hover {
      background: var(--hover-bg);
    }

    .chat-item.active {
      background: var(--hover-bg);
    }

    .delete-chat-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      padding: 4px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .chat-item:hover .delete-chat-btn {
      opacity: 1;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 10px;
      animation: fadeIn 0.3s ease-in-out;
    }

    .user-message {
      background: var(--user-message-bg);
    }

    .assistant-message {
      background: var(--message-bg);
    }

    .message strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text-color);
    }

    .input-container {
      padding: 20px;
      background: var(--bg-color);
      border-top: 1px solid var(--border-color);
      position: sticky;
      bottom: 0;
      z-index: 100;
    }

    .input-wrapper {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      padding: 12px 45px 12px 12px;
      font-size: 16px;
      background: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      resize: none;
      min-height: 60px;
      max-height: 200px;
    }

    .send-button, .file-button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--button-bg);
      padding: 8px;
    }

    .send-button:disabled {
      color: var(--border-color);
      cursor: not-allowed;
    }

    .file-input {
      display: none;
    }

    .typing-indicator {
      display: none;
      padding: 20px;
      background: var(--message-bg);
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .typing-indicator span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--text-color);
      border-radius: 50%;
      margin-right: 4px;
      animation: typing 1s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1000;
        transform: translateX(-100%);
        width: 80vw;
        min-width: 220px;
        max-width: 320px;
        height: 100vh;
        padding: 10px 0 60px 0;
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .sidebar-toggle {
        display: block;
        top: 16px;
        left: 16px;
        width: 48px;
        height: 48px;
        padding: 0;
        background: var(--hover-bg);
        border-radius: 12px;
      }

      .main-content {
        margin: 0;
        padding: 0;
        height: 100vh;
        max-width: 100vw;
        width: 100vw;
      }

      .chat-container {
        padding: 8px 4px 0 4px;
        min-height: 50vh;
        max-height: calc(100vh - 180px);
        height: calc(100vh - 180px);
      }

      #history {
        min-height: 40vh;
        max-height: calc(100vh - 220px);
        overflow-y: auto;
      }

      .input-container {
        padding: 8px 4px;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1001;
        background: var(--bg-color);
        border-top: 1px solid var(--border-color);
      }

      .input-wrapper {
        max-width: 100vw;
        width: 100vw;
        margin: 0;
        gap: 4px;
      }

      textarea {
        min-height: 44px;
        font-size: 15px;
        padding: 10px 40px 10px 10px;
      }

      .send-button, .file-button {
        padding: 4px;
        width: 36px;
        height: 36px;
      }

      .settings-button {
        position: fixed;
        left: auto;
        right: 16px;
        bottom: 72px;
        z-index: 1100;
        background: var(--hover-bg);
        border-radius: 12px;
        padding: 10px 16px;
        font-size: 15px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .settings-button svg {
        width: 22px;
        height: 22px;
      }

      .message {
        padding: 12px;
        font-size: 15px;
        border-radius: 10px;
      }

      .chat-item {
        padding: 10px 8px;
        font-size: 15px;
        border-radius: 8px;
      }

      .delete-chat-btn {
        padding: 2px;
      }
    }
  </style>
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 12h18M3 6h18M3 18h18"/>
    </svg>
  </button>

  <div class="sidebar" id="sidebar">
    <button class="new-chat-btn" onclick="createNewChat()">
      <span>+</span> Новый чат
    </button>
    <div class="chat-history" id="chatHistory"></div>
  </div>

  <div class="main-content">
    <div class="chat-container" id="chatContainer">
      <div id="history"></div>
      <div id="typingIndicator" class="typing-indicator">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <div class="input-container">
      <div class="input-wrapper">
        <input type="file" id="fileInput" class="file-input" onchange="handleFileUpload(event)">
        <button class="file-button" onclick="document.getElementById('fileInput').click()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </button>
        <textarea 
          id="message" 
          placeholder="Введите сообщение..." 
          rows="1"
          onkeydown="handleKeyDown(event)"
        ></textarea>
        <button class="send-button" onclick="send()" id="sendButton" disabled>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <button class="settings-button" onclick="toggleSettings()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z"/>
      <path d="M19.4 15C19.2669 15.3016 19.2272 15.6362 19.286 15.9606C19.3448 16.285 19.4995 16.5843 19.73 16.82L19.79 16.88C19.976 17.0657 20.1235 17.2863 20.2241 17.5291C20.3248 17.7719 20.3766 18.0322 20.3766 18.295C20.3766 18.5578 20.3248 18.8181 20.2241 19.0609C20.1235 19.3037 19.976 19.5243 19.79 19.71C19.6043 19.896 19.3837 20.0435 19.1409 20.1441C18.8981 20.2448 18.6378 20.2966 18.375 20.2966C18.1122 20.2966 17.8519 20.2448 17.6091 20.1441C17.3663 20.0435 17.1457 19.896 16.96 19.71L16.9 19.65C16.6643 19.4195 16.365 19.2648 16.0406 19.206C15.7162 19.1472 15.3816 19.1869 15.08 19.32C14.7842 19.4468 14.532 19.6572 14.3543 19.9255C14.1766 20.1938 14.0813 20.5082 14.08 20.83V21C14.08 21.5304 13.8693 22.0391 13.4942 22.4142C13.1191 22.7893 12.6104 23 12.08 23C11.5496 23 11.0409 22.7893 10.6658 22.4142C10.2907 22.0391 10.08 21.5304 10.08 21V20.91C10.0723 20.579 9.96512 20.2573 9.77299 19.988C9.58086 19.7187 9.31259 19.5141 9 19.4C8.69838 19.2669 8.36381 19.2272 8.03941 19.286C7.71502 19.3448 7.41568 19.4995 7.18 19.73L7.12 19.79C6.93425 19.976 6.71368 20.1235 6.47088 20.2241C6.22808 20.3248 5.96783 20.3766 5.705 20.3766C5.44217 20.3766 5.18192 20.3248 4.93912 20.2241C4.69632 20.1235 4.47575 19.976 4.29 19.79C4.10405 19.6043 3.95653 19.3837 3.85588 19.1409C3.75523 18.8981 3.70343 18.6378 3.70343 18.375C3.70343 18.1122 3.75523 17.8519 3.85588 17.6091C3.95653 17.3663 4.10405 17.1457 4.29 16.96L4.35 16.9C4.58054 16.6643 4.73519 16.365 4.794 16.0406C4.85282 15.7162 4.81312 15.3816 4.68 15.08C4.55324 14.7842 4.34276 14.532 4.07447 14.3543C3.80618 14.1766 3.49179 14.0813 3.17 14.08H3C2.46957 14.08 1.96086 13.8693 1.58579 13.4942C1.21071 13.1191 1 12.6104 1 12.08C1 11.5496 1.21071 11.0409 1.58579 10.6658C1.96086 10.2907 2.46957 10.08 3 10.08H3.09C3.42099 10.0723 3.74273 9.96512 4.012 9.77299C4.28127 9.58086 4.48594 9.31259 4.6 9C4.73312 8.69838 4.77282 8.36381 4.714 8.03941C4.65519 7.71502 4.50054 7.41568 4.27 7.18L4.21 7.12C4.02405 6.93425 3.87653 6.71368 3.77588 6.47088     </svg>
    Настройки
  </button>

  <div class="settings-modal" id="settingsModal">
    <div class="settings-content">
      <div class="settings-header">
        <div class="settings-title">Настройки</div>
        <button class="close-button" onclick="toggleSettings()">×</button>
      </div>
      
      <div class="settings-section">
        <h3>API Ключ OpenAI</h3>
        <p>Введите ваш API ключ для доступа к GPT моделям</p>
        <input 
          type="password" 
          id="apiKey" 
          placeholder="sk-..." 
          value=""
        />
      </div>

      <div class="settings-section">
        <h3>Модель GPT</h3>
        <p>Выберите модель для генерации ответов</p>
        <select id="modelSelect">
          <option value="gpt-4-1106-preview" selected>GPT-4.1 (Turbo)</option>
          <option value="gpt-4">GPT-4 (обычная)</option>
          <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
        </select>
      </div>

      <button class="save-button" onclick="saveSettings()">Сохранить настройки</button>
    </div>
  </div>

  <script>
    let chats = JSON.parse(localStorage.getItem("chats")) || [];
    let currentChatId = null;

    function createNewChat() {
      const chatId = Date.now().toString();
      const newChat = {
        id: chatId,
        title: "Новый чат",
        messages: []
      };
      chats.unshift(newChat);
      currentChatId = chatId;
      saveChats();
      renderChatHistory();
      renderChat();
    }

    function saveChats() {
      localStorage.setItem("chats", JSON.stringify(chats));
    }

    function renderChatHistory() {
      const historyEl = document.getElementById("chatHistory");
      historyEl.innerHTML = "";
      
      chats.forEach(chat => {
        const div = document.createElement("div");
        div.classList.add("chat-item");
        if (chat.id === currentChatId) {
          div.classList.add("active");
        }
        div.innerHTML = `
          <span>${chat.title}</span>
          <button class="delete-chat-btn" onclick="deleteChat('${chat.id}', event)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        `;
        div.onclick = () => {
          currentChatId = chat.id;
          renderChatHistory();
          renderChat();
          if (window.innerWidth <= 768) {
            toggleSidebar();
          }
        };
        historyEl.appendChild(div);
      });
    }

    function renderChat() {
      const chat = chats.find(c => c.id === currentChatId);
      if (!chat) return;

      const historyEl = document.getElementById("history");
      historyEl.innerHTML = "";
      
      chat.messages.forEach(entry => {
        const div = document.createElement("div");
        div.classList.add("message");
        div.classList.add(entry.role === "user" ? "user-message" : "assistant-message");
        div.innerHTML = `<strong>${entry.role === "user" ? "👤 Пользователь" : "🤖 GPT"}:</strong> ${entry.message}`;
        historyEl.appendChild(div);
      });

      historyEl.scrollTop = historyEl.scrollHeight;
    }

    function handleKeyDown(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    }

    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      sidebar.classList.toggle("active");
    }

    function deleteChat(chatId, event) {
      event.stopPropagation();
      if (confirm("Вы уверены, что хотите удалить этот чат?")) {
        chats = chats.filter(chat => chat.id !== chatId);
        if (currentChatId === chatId) {
          currentChatId = chats.length > 0 ? chats[0].id : null;
        }
        saveChats();
        renderChatHistory();
        renderChat();
      }
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const content = e.target.result;
          // Здесь можно добавить обработку содержимого файла
          console.log("Файл загружен:", file.name);
          // Добавляем информацию о файле в чат
          const message = `Прикреплен файл: ${file.name}`;
          if (!currentChatId) {
            createNewChat();
          }
          const chat = chats.find(c => c.id === currentChatId);
          if (chat) {
            chat.messages.push({ role: "user", message });
            saveChats();
            renderChat();
          }
        };
        reader.readAsText(file);
      }
    }

    async function send() {
      const message = document.getElementById("message").value.trim();
      if (!message) return;

      const apiKey = localStorage.getItem("apiKey");
      const model = localStorage.getItem("model") || "gpt-4-1106-preview";

      if (!apiKey) {
        alert("Пожалуйста, введите API ключ в настройках");
        toggleSettings();
        return;
      }

      if (!currentChatId) {
        createNewChat();
      }

      const chat = chats.find(c => c.id === currentChatId);
      if (!chat) return;

      chat.messages.push({ role: "user", message });
      if (chat.title === "Новый чат") {
        chat.title = message.substring(0, 30) + (message.length > 30 ? "..." : "");
      }
      saveChats();
      renderChat();
      document.getElementById("message").value = "";

      const typingIndicator = document.getElementById("typingIndicator");
      typingIndicator.style.display = "block";

      try {
        console.log("Отправка запроса...");
        
        // Формируем историю сообщений для контекста
        const messages = chat.messages.map(msg => ({
          role: msg.role,
          content: msg.message
        }));

        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: model,
            messages: messages,
            temperature: 0.7,
            max_tokens: 2000
          })
        });

        console.log("Получен ответ:", response.status);
        
        if (!response.ok) {
          const errorData = await response.json();
          console.error("Ошибка API:", errorData);
          throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        console.log("Данные ответа:", data);

        if (data.error) {
          throw new Error(data.error.message);
        }

        const reply = data.choices[0].message.content;
        chat.messages.push({ role: "assistant", message: reply });
        saveChats();
        renderChat();
      } catch (error) {
        console.error("Ошибка при отправке запроса:", error);
        chat.messages.push({ 
          role: "assistant", 
          message: `Произошла ошибка: ${error.message}. Пожалуйста, проверьте API ключ и попробуйте снова.` 
        });
        saveChats();
        renderChat();
      } finally {
        typingIndicator.style.display = "none";
      }
    }

    // Инициализация
    document.getElementById("message").addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = (this.scrollHeight) + "px";
      document.getElementById("sendButton").disabled = !this.value.trim();
    });

    if (chats.length === 0) {
      createNewChat();
    } else {
      currentChatId = chats[0].id;
      renderChatHistory();
      renderChat();
    }

    function toggleSettings() {
      const modal = document.getElementById("settingsModal");
      modal.classList.toggle("active");
      
      // Загружаем сохраненные настройки при открытии
      if (modal.classList.contains("active")) {
        const savedApiKey = localStorage.getItem("apiKey");
        const savedModel = localStorage.getItem("model");
        
        if (savedApiKey) document.getElementById("apiKey").value = savedApiKey;
        if (savedModel) document.getElementById("modelSelect").value = savedModel;
      }
    }

    function saveSettings() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const model = document.getElementById("modelSelect").value;
      
      localStorage.setItem("apiKey", apiKey);
      localStorage.setItem("model", model);
      
      toggleSettings();
    }

    // Инициализация
    if (window.innerWidth <= 768) {
      const sidebar = document.getElementById("sidebar");
      sidebar.classList.remove("active");
    }
  </script>
</body>
</html>
